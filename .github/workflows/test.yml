name: Test Voice Target Lab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Install optional WORLD backend
        # pyworld ships as an sdist and needs a C++ toolchain. If it cannot be
        # built the WORLD tests skip themselves, so this must not fail the job.
        continue-on-error: true
        run: python -m pip install '.[world]'
      - name: Run tests
        run: python -m pytest -q
